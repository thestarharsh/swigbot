services:
  postgres:
    image: postgres:16-alpine
    container_name: swigbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swigbot
      POSTGRES_PASSWORD: swigbot
      POSTGRES_DB: swigbot
    ports:
      - "5433:5432"
    volumes:
      - swigbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swigbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  swigbot_pgdata:
